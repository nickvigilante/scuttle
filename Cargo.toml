[workspace]
resolver = "3"
members = ["crates/scuttle-core", "crates/scuttle-tui"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
coder-sdk = { git = "https://github.com/nickvigilante/unofficial-coder-sdk-rs", rev = "7651597edb440293f427be098b51ce0e27323e68" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
toml = "0.9"
toml_edit = "0.23"
uuid = { version = "1", features = ["serde", "v4"] }
