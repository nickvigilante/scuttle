[workspace]
resolver = "3"
members = ["crates/scuttle-core", "crates/scuttle-tui"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
coder-sdk = { git = "https://github.com/nickvigilante/unofficial-coder-sdk-rs", rev = "1ade5ab7162058578c18ad0c75fc44c948f4939d" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
toml = "0.9"
toml_edit = "0.23"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
# A panic in any task, including a spawned one, ends the process after the panic hook restores
# the terminal, so nothing keeps drawing on a restored screen.
panic = "abort"
